name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: indigenous_crafts
          POSTGRES_USER: ic
          POSTGRES_PASSWORD: ic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ic -d indigenous_crafts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ic:ic@localhost:5432/indigenous_crafts
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Module boundaries
        run: lint-imports
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint, format, and types
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Tests
        working-directory: frontend
        run: npx playwright test
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
      - name: Backend logs
        if: failure()
        run: docker compose logs backend

  # Deploys only from main, and only when every test passed. Render's own auto-deploy is turned
  # off, so a failing build never goes live. The hooks are repository secrets.
  deploy:
    name: Deploy to Render
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the backend
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_BACKEND_DEPLOY_HOOK is not set, so the backend was not deployed."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$HOOK"
      - name: Deploy the frontend
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_FRONTEND_DEPLOY_HOOK is not set, so the frontend was not deployed."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$HOOK"
