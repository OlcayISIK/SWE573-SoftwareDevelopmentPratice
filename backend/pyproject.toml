[project]
name = "indigenous-crafts-backend"
version = "0.1.0"
description = "REST API for Indigenous Crafts"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "drf-spectacular>=0.28",
    "django-environ>=0.12",
    "django-cors-headers>=4.7",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "whitenoise>=6.9",
    "gunicorn>=23.0",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "factory-boy>=3.3",
    "ruff>=0.11",
    "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.importlinter]
root_packages = ["config", "core"]

[[tool.importlinter.contracts]]
name = "Module boundaries"
type = "layers"
layers = [
    "config",
    "core",
]
