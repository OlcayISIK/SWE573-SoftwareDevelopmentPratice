  /api/v1/users/{user_id}/crafts/:
    get:
      operationId: v1_users_crafts_list
      parameters:
      - in: query
        name: area
        schema:
          type: string
        description: Crafts with a place in west,south,east,north
      - in: query
        name: category
        schema:
          type: string
        description: Category slug
      - in: query
        name: color
        schema:
          type: string
        description: Main color, such as red
      - in: query
        name: country
        schema:
          type: string
        description: Country of the craft
      - in: query
        name: craft_type
        schema:
          type: integer
        description: Craft type id
      - in: query
        name: culture
        schema:
          type: integer
        description: Culture id
      - in: query
        name: exact
        schema:
          type: boolean
        description: Search only the words as typed, not other names of the items
          they name
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Text search
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - crafts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PaginatedCraftListList'
                  message:
                    type: string
          description: ''
  /api/v1/users/{user_id}/follow/:
    get:
      operationId: v1_users_follow_retrieve
