                  action: hide
                  reason: The photo shows a different craft. Hidden until the author
                    replaces it.
                summary: Hide a reported craft, with the reason for the record
                description: '`action` is `edit` (with `changes`), `hide`, `remove`,
                  or `dismiss`. Hiding or removing also closes the other open reports
                  on the craft.'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewActionCreateRequest'
