openapi: 3.0.3
info:
  title: Indigenous Crafts API
  version: 1.0.0
  description: REST API for the Indigenous Crafts interactive world map.
paths:
  /api/v1/{items}/{item_id}/report/:
    post:
      operationId: v1_report_create
      description: Reports a category, craft type, tool, material, or culture added
        by another user.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: path
        name: items
        schema:
          type: string
          pattern: ^categories|craft-types|tools|materials|cultures$
        required: true
      tags:
      - moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemReportCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItemReportCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ItemReportCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ItemReport'
                  message:
                    type: string
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Detail'
                  message:
                    type: string
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Detail'
                  message:
                    type: string
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
                  message:
                    type: string
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              LogIn:
                value:
                  email: ayse@example.com
                  password: tulip-kiln-cobalt-1575
                summary: Email and password
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  message:
                    type: string
              examples:
                Tokens:
                  value:
                    success: true
                    data:
                      refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCIsInVzZXJfaWQiOjd9.c2lnbmF0dXJl
                      access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwidXNlcl9pZCI6Nywicm9sZSI6InVzZXIifQ.c2lnbmF0dXJl
                    message: OK
                  summary: A 15-minute access token and a 7-day refresh token
                  description: 'Send the access token as `Authorization: Bearer <access>`.
                    Exchange the refresh token at `/auth/token/refresh/`; each refresh
                    token works once.'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                WrongEmailOrPassword:
                  value:
                    success: false
                    data: null
                    message: No active account found with the given credentials
                    errors: {}
                  summary: No active account found with the given credentials
          description: Wrong email or password
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TokenRefresh'
                  message:
                    type: string
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
                  message:
                    type: string
          description: ''
  /api/v1/auth/verify-email/resend/:
    post:
      operationId: v1_auth_verify_email_resend_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Detail'
                  message:
                    type: string
          description: ''
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      description: |-
        A lookup list for the craft form. Anyone can read it; registered users can add to it, and
        adding a name that already exists returns the existing item with 200 instead of 201.
      tags:
      - reference data
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  message:
                    type: string
          description: ''
    post:
      operationId: v1_categories_create
      description: |-
        A lookup list for the craft form. Anyone can read it; registered users can add to it, and
        adding a name that already exists returns the existing item with 200 instead of 201.
      tags:
      - reference data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddCategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Category'
                  message:
                    type: string
          description: ''
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Category'
                  message:
                    type: string
          description: ''
  /api/v1/craft-types/:
    get:
      operationId: v1_craft_types_list
      description: |-
        A lookup list for the craft form. Anyone can read it; registered users can add to it, and
        adding a name that already exists returns the existing item with 200 instead of 201.
      parameters:
      - in: query
        name: category
        schema:
          type: integer
        description: Category id
      tags:
      - reference data
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CraftType'
                  message:
                    type: string
          description: ''
    post:
      operationId: v1_craft_types_create
      description: |-
        A lookup list for the craft form. Anyone can read it; registered users can add to it, and
        adding a name that already exists returns the existing item with 200 instead of 201.
      tags:
      - reference data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCraftTypeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddCraftTypeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddCraftTypeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CraftType'
                  message:
                    type: string
          description: ''
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CraftType'
                  message:
                    type: string
          description: ''
  /api/v1/crafts/:
    get:
      operationId: v1_crafts_list
      parameters:
      - in: query
        name: area
        schema:
          type: string
        description: Crafts with a place in west,south,east,north
      - in: query
        name: category
        schema:
          type: string
        description: Category slug
      - in: query
        name: color
        schema:
          type: string
        description: Main color, such as red
      - in: query
        name: country
        schema:
          type: string
        description: Country of the craft
      - in: query
        name: craft_type
        schema:
          type: integer
        description: Craft type id
      - in: query
        name: culture
        schema:
          type: integer
        description: Culture id
      - in: query
        name: exact
        schema:
          type: boolean
        description: Search only the words as typed, not other names of the items
          they name
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Text search
      tags:
      - crafts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PaginatedCraftListList'
                  message:
                    type: string
              examples:
                SearchForKilim:
                  value:
                    success: true
                    data:
                      items:
                      - id: 33
                        name: Shirvan kilim
                        category:
                          id: 2
                          name: Textiles
                          slug: textiles
                          icon: spool
                          description: Cloth and objects made from fibres by spinning,
                            weaving, knotting, felting, dyeing or stitching.
                          user_added: false
                          added_by_me: false
                        craft_type:
                          id: 7
                          name: Kilim
                          description: A flat-woven rug without pile, its pattern
                            made by the coloured weft threads.
                          user_added: false
                          added_by_me: false
                        culture:
                          id: 29
                          name: Azerbaijani
                          homeland: Azerbaijan and northwestern Iran
                          description: A Turkic people of the South Caucasus and northwestern
                            Iran, known for carpets, silk and metalwork.
                          user_added: false
                          added_by_me: false
                        city: Shamakhi
                        country: Azerbaijan
                        latitude: 40.63412
                        longitude: 48.63834
                        cover_photo:
                          url: https://indigenous-crafts-api.onrender.com/media/crafts/33/4f401e1855b44ed8b10c506636eadfb8.jpg
                          alt_text: 'Kilim in progress on an upright loom: a white
                            ground with red and dark blue motifs, with balls of yarn
                            hanging from the weave'
                        status: published
                        author:
                          id: 4
                          display_name: Sample Contributor (Asia)
                        created_at: '2026-10-24T20:40:10.735951Z'
                      total: 1
                      page: 1
                      pageSize: 20
                      totalPages: 1
                    message: OK
                  summary: GET /api/v1/crafts/?search=kilim
                  description: Every word must start a word in the craft's fields,
                    tools, materials, or places. Filters such as `category=textiles`
                    or `color=blue` combine with the search.
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                UnknownMainColor:
                  value:
                    success: false
                    data: null
                    message: Validation failed.
                    errors:
                      color:
                      - '"violet" is not a valid choice.'
                  summary: GET /api/v1/crafts/?color=violet
          description: A filter is invalid
    post:
      operationId: v1_crafts_create
      tags:
      - crafts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CraftWriteRequest'
            examples:
              PublishACraft:
                value:
                  name: İznik tile
                  category: 1
                  craft_type: 2
                  tools:
                  - 7
                  - 2
                  - 8
                  materials:
                  - 1
                  - 6
                  - 3
                  - 5
                  culture: 25
                  places:
                  - address: İznik, Bursa, Türkiye
                    city: İznik
                    country: Türkiye
                    latitude: 40.429444
                    longitude: 29.721111
                    is_origin: true
                  - address: Kütahya, Türkiye
                    city: Kütahya
                    country: Türkiye
                    latitude: 39.41991
                    longitude: 29.98579
                  description: Fritware tiles painted under a clear glaze. The design
                    is pounced onto the white slip through a pricked paper stencil,
                    outlined in dark paint, filled with cobalt blue, turquoise, and
                    a raised red, then glazed and fired.
                  story: İznik tiles cover the walls of Ottoman mosques and palaces.
                    Their tulips, carnations, and saz leaves stand for paradise gardens,
                    and workshops in Kütahya keep the technique alive.
                  date:
                    kind: year
                    year: 1575
                    circa: true
                  colors:
                  - '#1e3a8a'
                  - '#0e9aa7'
                  - '#b91c1c'
                  - '#f8f5ee'
                  attributes:
                    dimensions:
                    - type: height
                      value: 25
                      unit: cm
                    - type: width
                      value: 25
                      unit: cm
                    distinguishing_features: Raised tomato-red under a clear glaze
                summary: An İznik tile made in two places, with its origin, date,
                  colors, and size
                description: Ids come from the lookup lists (`/categories/`, `/craft-types/`,
                  `/tools/`, `/materials/`, `/cultures/`). Needs a signed-in user
                  with a verified email.
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CraftWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CraftWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CraftDetail'
                  message:
                    type: string
              examples:
                PublishedCraft:
                  value:
                    success: true
                    data:
                      id: 37
                      name: İznik tile
                      category:
                        id: 1
                        name: Ceramics
                        slug: ceramics
                        icon: amphora
                        description: Objects shaped from clay and hardened by firing,
                          from everyday pottery to tiles, porcelain and figurines.
                        user_added: false
                        added_by_me: false
                      craft_type:
                        id: 2
                        name: Tile
                        description: A flat piece of fired clay, usually glazed and
                          painted, used to cover walls, floors or roofs.
                        user_added: false
                        added_by_me: false
                      tools:
                      - id: 7
                        name: Brush
                        description: Bristles on a handle, used to paint, glaze or
                          spread liquids.
                        user_added: false
                        added_by_me: false
                      - id: 2
                        name: Kiln
                        description: An oven that fires clay, glaze or glass at high
                          temperatures.
                        user_added: false
                        added_by_me: false
                      - id: 8
                        name: Pounce stencil
                        description: A pricked paper pattern; charcoal dust patted
                          through its holes transfers the design to a surface.
                        user_added: false
                        added_by_me: false
                      materials:
                      - id: 1
                        name: Clay
                        description: Fine earth that is soft when wet and hardens
                          when fired.
                        user_added: false
                        added_by_me: false
                      - id: 6
                        name: Cobalt oxide
                        description: A mineral pigment that gives a deep blue under
                          glaze.
                        user_added: false
                        added_by_me: false
                      - id: 3
                        name: Glaze
                        description: A glassy coating fused onto ceramics in the kiln.
                        user_added: false
                        added_by_me: false
                      - id: 5
                        name: Quartz
                        description: A hard mineral; ground quartz adds silica to
                          clay bodies and glazes.
                        user_added: false
                        added_by_me: false
                      parts: []
                      culture:
                        id: 25
                        name: Turkish
                        homeland: Anatolia, Türkiye
                        description: The people of Türkiye, whose crafts include tiles,
                          carpets, kilims, marbling and calligraphy.
                        user_added: false
                        added_by_me: false
                      address: İznik, Bursa, Türkiye
                      city: İznik
                      country: Türkiye
                      latitude: 40.429444
                      longitude: 29.721111
                      places:
                      - id: 41
                        address: İznik, Bursa, Türkiye
                        city: İznik
                        country: Türkiye
                        latitude: 40.429444
                        longitude: 29.721111
                        is_origin: true
                      - id: 42
                        address: Kütahya, Türkiye
                        city: Kütahya
                        country: Türkiye
                        latitude: 39.41991
                        longitude: 29.98579
                        is_origin: false
                      media: []
                      description: Fritware tiles painted under a clear glaze. The
                        design is pounced onto the white slip through a pricked paper
                        stencil, outlined in dark paint, filled with cobalt blue,
                        turquoise, and a raised red, then glazed and fired.
                      story: İznik tiles cover the walls of Ottoman mosques and palaces.
                        Their tulips, carnations, and saz leaves stand for paradise
                        gardens, and workshops in Kütahya keep the technique alive.
                      story_count: 0
                      date:
                        kind: year
                        year: 1575
                        day: null
                        circa: true
                      colors:
                      - '#1e3a8a'
                      - '#0e9aa7'
                      - '#b91c1c'
                      - '#f8f5ee'
                      attributes:
                        dimensions:
                        - type: height
                          unit: cm
                          value: 25
                        - type: width
                          unit: cm
                          value: 25
                        distinguishing_features: Raised tomato-red under a clear glaze
                      status: published
                      author:
                        id: 7
                        display_name: Ayşe
                      created_at: '2026-11-23T10:15:42.518204Z'
                      updated_at: '2026-11-23T10:15:42.518231Z'
                    message: OK
                  summary: The new craft, as GET /api/v1/crafts/{id}/ returns it
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                MissingPlaces:
                  value:
                    success: false
                    data: null
                    message: Validation failed.
                    errors:
                      places:
                      - This field is required.
                  summary: Each invalid field is listed with its messages
          description: A field is invalid
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NotSignedIn:
                  value:
                    success: false
                    data: null
                    message: Authentication credentials were not provided.
                    errors: {}
                  summary: Authentication credentials were not provided.
          description: Not signed in
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                EmailNotVerified:
                  value:
                    success: false
                    data: null
                    message: Verify your email address before publishing crafts.
                    errors: {}
                  summary: Verify your email address before publishing crafts.
          description: The email is not verified
