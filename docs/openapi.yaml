  /api/v1/wikidata/search/:
    get:
      operationId: v1_wikidata_search_list
      description: |-
        Finds Wikidata items by name, so a user adding a category, craft type, tool, material, or
        culture can say which one they mean. Returns 503 when Wikidata cannot be reached.
      parameters:
      - in: query
        name: q
        schema:
          type: string
          minLength: 2
          maxLength: 80
        description: The name to look up.
        required: true
      tags:
      - reference data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WikidataItem'
                  message:
                    type: string
          description: ''
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        is_email_verified:
          type: boolean
      required:
      - email
      - id
    ActionEnum:
      enum:
      - edit
      - hide
      - remove
      - dismiss
      type: string
      description: |-
        * `edit` - Edit
        * `hide` - Hide
        * `remove` - Remove
        * `dismiss` - Dismiss
    AddCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 300
        wikidata_id:
          description: The Wikidata item the user picked for the new item, from /wikidata/search/.
            Its names in English and Turkish let searches find the item.
          oneOf:
          - type: string
            maxLength: 16
            pattern: ^Q[1-9][0-9]{0,11}$
          - type: string
            maxLength: 0
        icon:
          allOf:
          - $ref: '#/components/schemas/IconEnum'
          default: sparkles
      required:
      - name
    AddCraftTypeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 300
        wikidata_id:
          description: The Wikidata item the user picked for the new item, from /wikidata/search/.
            Its names in English and Turkish let searches find the item.
          oneOf:
          - type: string
            maxLength: 16
            pattern: ^Q[1-9][0-9]{0,11}$
          - type: string
            maxLength: 0
        category:
          type: integer
      required:
      - category
      - name
    AddCultureRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 300
        wikidata_id:
          description: The Wikidata item the user picked for the new item, from /wikidata/search/.
            Its names in English and Turkish let searches find the item.
          oneOf:
          - type: string
            maxLength: 16
            pattern: ^Q[1-9][0-9]{0,11}$
          - type: string
            maxLength: 0
        homeland:
          type: string
          maxLength: 120
      required:
      - name
    AddLinkedItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 300
        wikidata_id:
          description: The Wikidata item the user picked for the new item, from /wikidata/search/.
            Its names in English and Turkish let searches find the item.
          oneOf:
          - type: string
            maxLength: 16
            pattern: ^Q[1-9][0-9]{0,11}$
          - type: string
            maxLength: 0
        craft_type:
          type: integer
          description: Craft type the item is typical for.
      required:
      - name
    Author:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          readOnly: true
      required:
