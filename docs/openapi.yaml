                required:
                - success
                - data
                - message
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ReportReview'
                  message:
                    type: string
              examples:
                ReviewedReport:
                  value:
                    success: true
                    data:
                      id: 5
                      craft:
                        id: 1
                        name: Kütahya Çinisi
                        status: hidden
                        is_deleted: false
                        author:
                          id: 1
                          display_name: Sample Contributor (Anatolia)
                      reporter:
                        id: 9
                        display_name: Mehmet
                      reason: inaccurate
                      note: The photo shows an İznik tile, not one from Kütahya.
                      status: resolved
                      created_at: '2026-11-23T10:30:12.904417Z'
                      actions:
                      - id: 3
                        action: hide
                        reason: The photo shows a different craft. Hidden until the
                          author replaces it.
                        admin:
                          id: 2
                          display_name: Moderator
                        created_at: '2026-11-23T11:02:48.117093Z'
                    message: OK
                  summary: The report, now resolved, with its review history
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NotAnAdmin:
                  value:
                    success: false
                    data: null
                    message: You do not have permission to perform this action.
                    errors: {}
                  summary: You do not have permission to perform this action.
          description: The user is not an admin
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AlreadyReviewed:
                  value:
                    success: false
                    data: null
                    message: This report has already been reviewed.
                    errors: {}
                  summary: This report has already been reviewed.
          description: The report was already reviewed
