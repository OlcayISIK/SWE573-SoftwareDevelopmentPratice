services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indigenous_crafts
      POSTGRES_USER: ic
      POSTGRES_PASSWORD: ic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ic -d indigenous_crafts"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: local-compose-secret-key
      JWT_SIGNING_KEY: local-compose-jwt-signing-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      AUTO_VERIFY_EMAIL: "true"
      DJANGO_SECURE_COOKIES: "false"
      DATABASE_URL: postgres://ic:ic@db:5432/indigenous_crafts
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SERVE_MEDIA: "true"
      LOAD_SAMPLE_DATA: "true"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    environment:
      API_ORIGIN: http://localhost:8000
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
